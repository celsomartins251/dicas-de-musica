if(metronome||metroStarting)return;metroStarting=true;let bpm=Math.min(240,Math.max(40,+($('#bpmInput')?.value||metroBpm)||100)),ctx;try{ctx=getAudio();await ctx.resume();if(ctx.state!=='running')throw new Error('AUDIO_NOT_RUNNING')}catch(e){console.error(e);metroStarting=false;toast('O áudio está bloqueado. Toque em Play e confira o volume do dispositivo.');return}metroBpm=bpm;metroMeter=$('#meter')?.value||metroMeter;metroSubdiv=$('#subdiv')?.value||metroSubdiv;metroSound=$('#clicksound')?.value||metroSound;metronome={bpm,meter:metroMeter,subdiv:metroSubdiv,sound:metroSound};if(timer)clearInterval(timer);beat=0;metroSubBeat=0;metroNextTime=ctx.currentTime+.08;updateBeatDots();let state=$('#metroState');if(state)state.textContent='EM EXECUÇÃO';$('#pulse')?.classList.remove('on');scheduler();timer=setInterval(scheduler,25);metroStarting=false;if($('#metroToggle'))$('#metroToggle').textContent='■  PARAR';mmSync()}function stopMetro(){if(timer)clearInterval(timer);timer=null;metronome=null;metroStarting=false;if($('#metroToggle'))$('#metroToggle').textContent='▶  INICIAR';let state=$('#metroState');if(state)state.textContent='PRONTO';$('#pulse')?.classList.remove('on');$$('#metroBeats .metro-beat').forEach(el=>el.classList.remove('active'));mmSync()}
function mmDots(){let r=$('#mmBeats');if(!r)return;let meter=metronome?.meter||metroMeter,n=Math.max(1,Math.min(12,Number(meter.split('/')[0])||4));r.innerHTML=Array.from({length:n},(_,i)=>`<i class="mm-beat${i===beat&&metronome?' on':''}"></i>`).join('')}
function mmTick(i){let p=$('#mmPulse');if(p){p.classList.add('on');setTimeout(()=>p.classList.remove('on'),95)}$$('#mmBeats .mm-beat').forEach((el,k)=>el.classList.toggle('on',k===i))}
function mmSync(){let b=$('#mmPlay');if(!b)return;let run=!!metronome;b.textContent=run?'■':'▶';$('#mmBpm').textContent=metronome?.bpm||metroBpm;$('#mmMeter').value=metronome?.meter||metroMeter;$('#metronomeQuick')?.classList.toggle('mm-on',run);if(!run)$$('#mmBeats .mm-beat').forEach(el=>el.classList.remove('on'))}
function mmShow(on){let m=$('#miniMetro');if(!m)return;m.classList.toggle('mm-out',!on);if(on){mmDots();mmSync()}}
function mmToggle(){let m=$('#miniMetro');if(m)mmShow(m.classList.contains('mm-out'))}
function mmInit(){let taps=[];$('#mmClose').onclick=()=>mmShow(false);$('#mmDown').onclick=()=>setBpm((metronome?.bpm||metroBpm)-1);$('#mmUp').onclick=()=>setBpm((metronome?.bpm||metroBpm)+1);$('#mmPlay').onclick=()=>metronome?stopMetro():startMetro();$('#mmTap').onclick=()=>{let t=Date.now();if(taps.length&&t-taps.at(-1)>2500)taps=[];taps.push(t);if(taps.length>5)taps.shift();if(taps.length>1)setBpm(Math.round(60000/((taps.at(-1)-taps[0])/(taps.length-1))))};$('#mmMeter').onchange=()=>{metroMeter=$('#mmMeter').value;if(metronome){metronome.meter=metroMeter;metroNextTime=getAudio().currentTime+.04;beat=0;metroSubBeat=0}if($('#meter'))$('#meter').value=metroMeter;updateBeatDots();mmDots()};let st=$('#stage'),down=null;st.addEventListener('pointerdown',e=>{if(e.isPrimary)down={x:e.clientX,y:e.clientY,t:Date.now()}},true);st.addEventListener('pointerup',e=>{let m=$('#miniMetro');if(!e.isPrimary||!down||m.classList.contains('mm-out'))return;let d=Math.hypot(e.clientX-down.x,e.clientY-down.y),dt=Date.now()-down.t;down=null;if(d>12||dt>500)return;let r=st.getBoundingClientRect(),rx=(e.clientX-r.left)/r.width;if(rx>.3&&rx<.7)mmShow(false)},true)}
mmInit();
const PK={first:1,oct:6,kw:0,vis:3,init:false};
function pkBuild(){let inner=$('#pkInner');if(!inner||inner.childElementCount)return;let names=['C','D','E','F','G','A','B'],semi=[0,2,4,5,7,9,11],blackAfter=[0,1,3,4,5],html='';for(let o=0;o<PK.oct;o++){let oc=PK.first+o;for(let w=0;w<7;w++){let wi=o*7+w,midi=12*(oc+1)+semi[w];html+=`<button class="pk-w${w===0?' pk-c':''}" data-m="${midi}"><span>${names[w]}${w===0?oc:''}</span></button>`;if(blackAfter.includes(w))html+=`<button class="pk-b" data-m="${midi+1}" style="left:calc(var(--kw)*${wi+1} - var(--kw)*.3)"></button>`}}inner.innerHTML=html}
function pkLabel(){let sc=$('#pkScroll');if(!sc||!PK.kw)return;let o=Math.round(sc.scrollLeft/(7*PK.kw))+PK.first;$('#pkRange').textContent=`C${o} – B${o+PK.vis-1}`}
function pkLayout(){let sc=$('#pkScroll');if(!sc||!sc.clientWidth)return;let o=PK.kw?Math.round(sc.scrollLeft/(7*PK.kw)):2;PK.vis=sc.clientWidth>=1000?3:2;PK.kw=sc.clientWidth/(PK.vis*7);let inner=$('#pkInner');inner.style.setProperty('--kw',PK.kw+'px');inner.style.width=(PK.kw*7*PK.oct)+'px';sc.scrollLeft=(PK.init?o:2)*7*PK.kw;PK.init=true;pkLabel()}
function pkShow(on){let d=$('#pianoDock');if(!d)return;if(on)pkBuild();d.classList.toggle('open',on);$('#reader').classList.toggle('piano-open',on);$('#pianoQuick')?.classList.toggle('mm-on',on);if(on)pkLayout();if(pdfDoc)requestAnimationFrame(()=>renderPage())}
function pkToggle(){let d=$('#pianoDock');if(d)pkShow(!d.classList.contains('open'))}
function pkInit(){let sc=$('#pkScroll'),inner=$('#pkInner');$('#pkPrev').onclick=()=>sc.scrollBy({left:-7*PK.kw,behavior:'smooth'});$('#pkNext').onclick=()=>sc.scrollBy({left:7*PK.kw,behavior:'smooth'});$('#pkNames').onclick=()=>$('#pianoDock').classList.toggle('pk-names');$('#pkClose').onclick=()=>pkShow(false);sc.addEventListener('scroll',pkLabel,{passive:true});inner.addEventListener('pointerdown',e=>{let b=e.target.closest('button[data-m]');if(!b)return;playNote(+b.dataset.m);b.classList.add('down');setTimeout(()=>b.classList.remove('down'),180)});window.addEventListener('resize',()=>{if($('#pianoDock').classList.contains('open'))pkLayout()})}
pkInit();
const notes=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];function buildPiano(){let keys=$('#keys');if(!keys)return;keys.innerHTML='';let oct=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];for(let i=0;i<24;i++){let n=oct[i%12],isB=n.includes('#');if(!isB){let b=document.createElement('button');b.className='keywhite';b.dataset.note=i;b.innerHTML=$('#showNames')?.checked?n:'';b.onpointerdown=()=>playNote(48+i);keys.append(b)}else{let b=document.createElement('button');b.className='keyblack';b.dataset.note=i;b.textContent=$('#showNames')?.checked?n:'';let whites=Math.floor(i/12)*7+[0,1,2,3,4,5,6].filter((_,ix)=>[1,3,6,8,10].includes(i%12)).length;let left=((Math.floor(i/12)*7)+({1:1,3:2,6:4,8:5,10:6}[i%12]))*100/14-3; b.style.left=left+'%';b.onpointerdown=()=>playNote(48+i);keys.append(b)}}$('#showNames').onchange=()=>buildPiano()}
function playNote(midi){let ctx=getAudio(),o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=440*Math.pow(2,(midi-69)/12);g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.22,ctx.currentTime+.012);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+1.4);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+1.45);let n=notes[midi%12],oct=Math.floor(midi/12)-1;$('#noteout')&&($('#noteout').textContent=n+oct+' · '+(440*Math.pow(2,(midi-69)/12)).toFixed(1)+' Hz')}
init();
