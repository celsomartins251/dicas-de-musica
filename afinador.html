<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>MARTINS AFINADOR CROMÁTICO</title>
<style>
:root{--c:#8a8f88;--ok:#4dff6d;box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Montserrat,Poppins,"Segoe UI",Roboto,system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.stage{position:relative;width:min(100vw,calc(100vh*1080/1920));width:min(100vw,calc(100dvh*1080/1920));aspect-ratio:1080/1920;container-type:inline-size;background:#050505 var(--skin) center/100% 100% no-repeat;user-select:none;-webkit-user-select:none}
.abs{position:absolute}
.crop{background-image:var(--skin);background-size:100cqw 177.778cqw;background-repeat:no-repeat}
[data-c]{transform:translate(-50%,-50%);text-align:center;white-space:nowrap}
button{font-family:inherit;cursor:pointer;border:0;padding:0;background:none;color:inherit}
#nn{font-size:23cqw;font-weight:800;line-height:1;color:var(--c);text-shadow:0 0 2.6cqw color-mix(in srgb,var(--c) 80%,transparent),0 0 7cqw color-mix(in srgb,var(--c) 40%,transparent);transition:color .2s;z-index:3}
#nn small{font-size:.34em;vertical-align:top;position:relative;top:.12em;margin-left:.04em}
#pt{font-size:2.7cqw;color:#d6c47a;letter-spacing:.08em;z-index:3}
#idle{width:74cqw;white-space:normal;font-size:3.5cqw;line-height:1.35;color:#9b9272;z-index:3}
#idle.err{color:#ff8a8a}
.rd{color:#ece8dc;font-size:5.3cqw;font-weight:500;z-index:3}
#stT{font-size:6.4cqw;font-weight:700;color:var(--c);letter-spacing:.01em;transition:color .2s;z-index:3}
#stT.long{font-size:4.1cqw;letter-spacing:.03em}
.led{width:1.5cqw;height:1.5cqw;border-radius:50%;background:#16301d;opacity:.9;transition:.2s;z-index:3}
.led.on{background:#58ff7e;box-shadow:0 0 2cqw .5cqw #3dff6a;opacity:1}
svg.nd{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:2}
.hub{border-radius:50%;z-index:3;pointer-events:none}
.mic{border-radius:4.6cqw;z-index:4}
.micfx{position:absolute;inset:0;border-radius:4.6cqw;opacity:0;filter:hue-rotate(85deg) saturate(1.35) brightness(1.1);transition:opacity .3s}
.mic.on .micfx{opacity:1;animation:gl 1.6s ease-in-out infinite}
@keyframes gl{50%{box-shadow:0 0 3.5cqw rgba(70,255,120,.55)}}
.mt{position:absolute;left:59.07%;top:50%;transform:translate(-50%,-50%);font-size:4.25cqw;font-weight:600;letter-spacing:.02em;color:#e6cf86;white-space:nowrap;text-shadow:0 0 1cqw rgba(212,175,55,.25);transition:color .3s}
.mic.on .mt{color:#b9ffd0;text-shadow:0 0 1.2cqw rgba(70,255,120,.5)}
.cb{z-index:4;border-radius:3.4cqw;background:linear-gradient(180deg,#1d1c1a,#0c0b0a);border:.2cqw solid #5a4a22;box-shadow:inset 0 0 0 .3cqw #0b0a09,inset 0 0 0 .4cqw rgba(160,125,50,.4),0 .4cqw 1cqw #000;display:flex;align-items:center;justify-content:center;font-size:4.4cqw;font-weight:500;color:#b3a48a;transition:.18s}
.cb.sel{transform:scale(1.047);border:.3cqw solid #e2bb4c;color:#f4dd88;font-weight:700;background:linear-gradient(180deg,#1b1812,#0b0a08);box-shadow:inset 0 0 0 .3cqw #0b0a09,inset 0 0 1.6cqw rgba(230,190,70,.28),0 0 3cqw rgba(230,190,70,.55);text-shadow:0 0 1.4cqw rgba(240,200,80,.6)}
.cb:active{transform:scale(.97)}.cb.sel:active{transform:scale(1.0)}
.gear{z-index:5;display:flex;align-items:center;justify-content:center;color:#b99a3c;opacity:.85}
.gear svg{width:46%;height:46%}
/* painel de ajustes */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center;z-index:20}
#sheet.open{display:flex}
.sh{width:min(100%,520px);max-height:90vh;overflow:auto;background:linear-gradient(180deg,#14130f,#070707);border:1px solid rgba(212,175,55,.5);border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));color:#e8e2d0;font-size:15px}
.sh h2{margin:0 0 12px;text-align:center;font-size:13px;letter-spacing:.3em;color:#d4af37;font-weight:600}
.lb{font-size:11px;letter-spacing:.2em;color:#8d8a80;margin:14px 0 8px}
.sb{width:100%;height:50px;border-radius:14px;border:1px solid #5a4a22;background:linear-gradient(180deg,#1d1c1a,#0c0b0a);color:#d9ccac;font-size:15px;font-weight:600}
.sb:disabled{opacity:.4}
select{width:100%;height:50px;background:#101010;color:#e8e2d0;border:1px solid #5a4a22;border-radius:14px;padding:0 12px;font-size:15px;font-family:inherit}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.chip{min-width:62px;height:50px;border-radius:14px;border:1px solid #5a4a22;background:linear-gradient(180deg,#1d1c1a,#0c0b0a);color:#e8e2d0;font-size:16px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center}
.chip i{font-style:normal;font-size:10px;color:#8d8a80;font-weight:400}
.chip.near{border-color:#4dff6d;box-shadow:0 0 14px rgba(77,255,109,.5)}
.fld{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0}
.fld input{flex:1;max-width:48%;accent-color:#d4af37}
.fld .sb{width:auto;height:42px;padding:0 14px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
</style>
</head>
<body>
<div class="stage" id="stage">
<div class="abs led" data-c="153,397" id="l1"></div><div class="abs led" data-c="926,397" id="l2"></div>
<div class="abs" id="nn" data-c="540,398">—</div>
<div class="abs" id="idle" data-c="540,400">Ative o microfone para começar.</div>
<div class="abs" id="pt" data-c="540,512"></div>
<svg class="nd" viewBox="0 0 1080 1920"><defs><filter id="gw" x="-300%" y="-10%" width="700%" height="120%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<g id="needle" style="color:#8a8f88;transition:color .15s"><polygon points="525,1072 555,1072 542.6,655 537.4,655" fill="currentColor" filter="url(#gw)"/><polygon points="535,1040 545,1040 540.7,668 539.3,668" fill="#fff" opacity=".5"/></g></svg>
<div class="abs crop hub" data-box="484,1024,112,112"></div>
<div class="abs rd" id="hzT" data-c="332,1235">— Hz</div>
<div class="abs rd" id="ctT" data-c="737,1235">— cents</div>
<div class="abs" id="stT" data-c="521,1342">AGUARDANDO</div>

<button class="abs mic" id="bs" data-box="110,1462,860,186" aria-label="Ativar ou parar microfone"><div class="micfx crop" data-crop="110,1462"></div><span class="mt" id="bst">ATIVAR MICROFONE</span></button>
<button class="abs cb" data-box="95,1715,273,107" data-f="432">432 Hz</button>
<button class="abs cb sel" data-box="403,1715,273,107" data-f="440">440 Hz</button>
<button class="abs cb" data-box="713,1715,273,107" data-f="442">442 Hz</button>
<button class="abs gear" id="bg" data-box="900,70,130,130" aria-label="Configurações"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg></button>
</div>

<div id="sheet"><div class="sh">
<h2>CONFIGURAÇÕES</h2>
<div class="lb">INSTRUMENTO</div>
<select id="ins"><option value="chrom">Cromático universal</option><option value="b4">Contrabaixo 4 cordas (E A D G)</option><option value="b5">Contrabaixo 5 cordas (B E A D G)</option><option value="vio">Violão 6 cordas</option><option value="gui">Guitarra 6 cordas</option><option value="cav">Cavaquinho</option></select>
<div class="chips" id="chips"></div>
<div style="text-align:center;font-size:11px;color:#8d8a80;margin-top:6px">Toque numa corda para ouvir a nota de referência.</div>
<div class="fld"><span>Notação</span><button class="sb" id="fl">Sustenidos (#)</button></div>
<div class="fld"><span>Tolerância <b id="tv">±3</b> cents</span><input type="range" id="tol" min="1" max="10" value="3"></div>
<div class="fld"><span>Sensibilidade do ponteiro</span><input type="range" id="sen" min="1" max="10" value="6"></div>
<div class="r2"><button class="sb" id="bx" disabled>PARAR AFINAÇÃO</button><button class="sb" id="cl">FECHAR</button></div>
</div></div>

(()=>{
const $=id=>document.getElementById(id);
// posicionamento em coordenadas da imagem (1080x1920)
document.querySelectorAll('[data-box]').forEach(e=>{const[x,y,w,h]=e.dataset.box.split(',').map(Number);Object.assign(e.style,{left:x/10.8+'%',top:y/19.2+'%',width:w/10.8+'%',height:h/19.2+'%'});
 if(e.classList.contains('crop'))e.style.backgroundPosition=`-${x/10.8}cqw -${y/10.8}cqw`});
document.querySelectorAll('[data-crop]').forEach(e=>{const[x,y]=e.dataset.crop.split(',').map(Number);e.style.backgroundPosition=`-${x/10.8}cqw -${y/10.8}cqw`});
document.querySelectorAll('[data-c]').forEach(e=>{const[x,y]=e.dataset.c.split(',').map(Number);e.style.left=x/10.8+'%';e.style.top=y/19.2+'%'});

const S={ref:440,inst:'chrom',flats:false,tol:3,k:.31,on:false};
const SH=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],FL=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const PT=['Dó','Dó','Ré','Ré','Mi','Fá','Fá','Sol','Sol','Lá','Lá','Si'];
const INST={chrom:[],b4:[28,33,38,43],b5:[23,28,33,38,43],vio:[40,45,50,55,59,64],gui:[40,45,50,55,59,64],cav:[62,67,71,74]};
const FMIN={chrom:28,b4:35,b5:26,vio:70,gui:70,cav:140};
const DEG=1.73;
const mf=m=>S.ref*Math.pow(2,(m-69)/12);
const nm=m=>(S.flats?FL:SH)[((m%12)+12)%12];
const col=c=>{c=Math.abs(c);if(c<=S.tol)return'#4dff6d';return`hsl(${58*(1-(c-S.tol)/(50-S.tol))} 100% 55%)`};

// ---- interface
function say(t,e){const i=$('idle');i.textContent=t;i.className='abs'+(e?' err':'')}
function chips(){const el=$('chips');el.innerHTML='';INST[S.inst].forEach(m=>{const b=document.createElement('button');b.className='chip';b.dataset.m=m;b.innerHTML=`${nm(m)}${Math.floor(m/12)-1}<i>${mf(m).toFixed(1)} Hz</i>`;b.onclick=()=>tone(mf(m));el.appendChild(b)})}
let tc;function tone(f){try{tc=tc||new(window.AudioContext||window.webkitAudioContext)();tc.resume();const o=tc.createOscillator(),g=tc.createGain();o.frequency.value=f;o.type='triangle';g.gain.setValueAtTime(.25,tc.currentTime);g.gain.exponentialRampToValueAtTime(.001,tc.currentTime+1.4);o.connect(g).connect(tc.destination);o.start();o.stop(tc.currentTime+1.5)}catch(e){}}
$('ins').onchange=e=>{S.inst=e.target.value;chips()};
document.querySelectorAll('.cb').forEach(b=>b.onclick=()=>{S.ref=+b.dataset.f;document.querySelectorAll('.cb').forEach(x=>x.classList.toggle('sel',x===b));chips()});
$('bg').onclick=()=>$('sheet').classList.add('open');
$('cl').onclick=()=>$('sheet').classList.remove('open');
$('sheet').onclick=e=>{if(e.target===$('sheet'))$('sheet').classList.remove('open')};
$('fl').onclick=()=>{S.flats=!S.flats;$('fl').textContent=S.flats?'Bemóis (b)':'Sustenidos (#)';chips()};
$('tol').oninput=e=>{S.tol=+e.target.value;$('tv').textContent='±'+S.tol};
$('sen').oninput=e=>{S.k=.06+ +e.target.value*.04};

// ---- YIN
const W=2048,d=new Float32Array(W+1),cm=new Float32Array(W+1);
function yin(x,sr,fmin){
 const tmax=Math.min(W,Math.floor(sr/fmin)),tmin=Math.max(2,Math.floor(sr/2200));
 let run=0;cm[0]=1;
 for(let t=1;t<=tmax;t++){let s=0;for(let j=0;j<W;j++){const v=x[j]-x[j+t];s+=v*v}d[t]=s;run+=s;cm[t]=run?s*t/run:1}
 let t=tmin;
 for(;t<tmax;t++){if(cm[t]<.12){while(t+1<tmax&&cm[t+1]<cm[t])t++;break}}
 if(t>=tmax)return -1;
 const a=cm[t-1],b=cm[t],c=cm[t+1],den=a-2*b+c;
 return sr/(den?t+(a-c)/(2*den):t);
}

// ---- áudio
let ctx,stream,src,an,buf,raf=0,lastDet=0,lastSig=0,hist=[],ang=0,tgt=0,curC=0,hasSig=false,nonzero=false,t0=0;
async function start(){
 if(S.on)return;
 if(!window.isSecureContext){say('O microfone exige HTTPS (contexto seguro). Publique a página em HTTPS.',1);return}
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){say('Navegador incompatível: sem suporte a captura de áudio.',1);return}
 const AC=window.AudioContext||window.webkitAudioContext;
 if(!AC){say('Navegador incompatível: sem Web Audio API.',1);return}
 say('Solicitando permissão do microfone…');
 try{
  stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  ctx=new AC();await ctx.resume();
  const tr=stream.getAudioTracks()[0];
  if(!tr||tr.readyState!=='live'||ctx.state!=='running')throw new Error('init');
  src=ctx.createMediaStreamSource(stream);an=ctx.createAnalyser();an.fftSize=4096;an.smoothingTimeConstant=0;src.connect(an);
  buf=new Float32Array(an.fftSize);nonzero=false;t0=performance.now();hist=[];
  S.on=true;ui(true);say('Toque uma corda para começar');show(null);
  raf=requestAnimationFrame(loop);
 }catch(e){
  cleanup();const n=e&&e.name;
  say(n==='NotAllowedError'||n==='SecurityError'?'Permissão de microfone negada. Libere o acesso nas configurações do navegador.':
      n==='NotFoundError'||n==='OverconstrainedError'?'Nenhum microfone encontrado neste dispositivo.':
      n==='NotReadableError'?'O microfone está em uso por outro aplicativo.':'Falha ao iniciar o microfone. Tente novamente.',1);
 }
}
function cleanup(){
 cancelAnimationFrame(raf);raf=0;
 try{src&&src.disconnect()}catch(e){}
 stream&&stream.getTracks().forEach(t=>t.stop());
 try{ctx&&ctx.state!=='closed'&&ctx.close()}catch(e){}
 ctx=stream=src=an=buf=null;S.on=false;
}
function stop(){cleanup();ui(false);hasSig=false;tgt=0;say('Afinação parada. Microfone liberado.');show(null);requestAnimationFrame(settle)}
function settle(){if(S.on)return;ang+=(0-ang)*.2;paint();if(Math.abs(ang)>.2)requestAnimationFrame(settle);else{ang=0;paint()}}
function ui(on){$('bs').classList.toggle('on',on);$('bst').textContent=on?'MICROFONE ATIVO':'ATIVAR MICROFONE';$('bx').disabled=!on}
$('bs').onclick=()=>S.on?stop():start();$('bx').onclick=()=>{stop();$('sheet').classList.remove('open')};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.on)stop()});

function detect(now){
 an.getFloatTimeDomainData(buf);
 let s=0;for(let i=0;i<buf.length;i++){const v=buf[i];s+=v*v;if(v!==0)nonzero=true}
 const rms=Math.sqrt(s/buf.length);
 if(!nonzero&&now-t0>3000){say('Nenhum sinal de áudio recebido do microfone.',1);t0=now+1e9}
 if(rms<.008)return null;
 const f=yin(buf,ctx.sampleRate,FMIN[S.inst]);
 return f>0?f:null;
}
function setSt(t){const e=$('stT');if(e.textContent!==t){e.textContent=t;e.classList.toggle('long',t.length>10)}}
function show(r){
 const root=document.documentElement.style,L=[$('l1'),$('l2')];
 if(!r){$('nn').style.display='none';$('pt').style.display='none';$('idle').style.display='';
  $('hzT').textContent='— Hz';$('ctT').textContent='— cents';root.setProperty('--c','#8a8f88');
  setSt(S.on?'SEM SINAL':'AGUARDANDO');L.forEach(l=>l.classList.remove('on'));
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('near'));return}
 const c=r.c,ok=Math.abs(c)<=S.tol,n=nm(r.m),acc=n[1];
 root.setProperty('--c',col(c));
 $('idle').style.display='none';$('nn').style.display='';$('pt').style.display='';
 $('nn').innerHTML=n[0]+(acc?`<small>${acc==='#'?'♯':'♭'}</small>`:'');
 $('pt').textContent=(PT[((r.m%12)+12)%12]+(acc?(acc==='#'?' sustenido':' bemol'):'')+' · OITAVA '+(Math.floor(r.m/12)-1)).toUpperCase();
 $('hzT').textContent=r.f.toFixed(1)+' Hz';
 const rc=Math.round(c);$('ctT').textContent=rc+' cents';
 setSt(ok?'AFINADO':c<0?'ABAIXO DA AFINAÇÃO':'ACIMA DA AFINAÇÃO');
 L.forEach(l=>l.classList.toggle('on',ok));
 let best=null,bd=99;INST[S.inst].forEach(m=>{const dd=Math.abs(m-r.mf);if(dd<bd){bd=dd;best=m}});
 document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('near',+x.dataset.m===best&&bd<1.5));
}
function paint(){const n=$('needle');n.setAttribute('transform',`rotate(${ang*DEG} 540 1080)`);
 n.style.color=hasSig&&S.on?(Math.abs(curC)<=S.tol?'#46e86a':col(curC)):'#7d857f';n.style.opacity=hasSig&&S.on?1:.55}
function loop(now){
 if(!S.on)return;
 if(now-lastDet>45){
  lastDet=now;
  const f=detect(now);
  if(f){
   hist.push(f);if(hist.length>5)hist.shift();
   const fm=[...hist].sort((a,b)=>a-b)[hist.length>>1];
   const mfl=69+12*Math.log2(fm/S.ref),m=Math.round(mfl),c=(mfl-m)*100;
   lastSig=now;hasSig=true;curC=c;tgt=Math.max(-50,Math.min(50,c));
   show({f:fm,m,mf:mfl,c});
  }else if(hasSig&&now-lastSig>700){hasSig=false;hist=[];tgt=0;show(null)}
 }
 ang+=(tgt-ang)*S.k;
 paint();
 raf=requestAnimationFrame(loop);
}
chips();paint();show(null);
})();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
