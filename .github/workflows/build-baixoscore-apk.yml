name: Build BaixoScore Pro APK

on:
  push:
    branches: [main]
    paths:
      - 'app-baixoscore-pro.html'
      - 'baixoscore-version.json'
      - 'android-baixoscore/**'
      - '.github/workflows/build-baixoscore-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare offline app assets
        run: |
          mkdir -p android-baixoscore/app/src/main/assets
          cp app-baixoscore-pro.html android-baixoscore/app/src/main/assets/index.html
          cp baixoscore-version.json android-baixoscore/app/src/main/assets/baixoscore-version.json

      - name: Build debug APK
        working-directory: android-baixoscore
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaixoScore-Pro-Android-APK
          path: android-baixoscore/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
