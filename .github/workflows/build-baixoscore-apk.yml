name: Build and publish BaixoScore Pro APK

on:
  push:
    branches: [main]
    paths:
      - 'app-baixoscore-pro.html'
      - 'baixoscore-version.json'
      - 'android-baixoscore/**'
      - '.github/workflows/build-baixoscore-apk.yml'
  pull_request:
    paths:
      - 'app-baixoscore-pro.html'
      - 'baixoscore-version.json'
      - 'android-baixoscore/**'
      - '.github/workflows/build-baixoscore-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android platform packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare offline app assets
        run: |
          mkdir -p android-baixoscore/app/src/main/assets
          cp app-baixoscore-pro.html android-baixoscore/app/src/main/assets/index.html
          cp baixoscore-version.json android-baixoscore/app/src/main/assets/baixoscore-version.json

      - name: Build APK
        working-directory: android-baixoscore
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare release asset
        run: cp android-baixoscore/app/build/outputs/apk/debug/app-debug.apk BaixoScore-Pro.apk

      - name: Publish versioned GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(jq -r '.version' baixoscore-version.json)"
          TAG="baixoscore-v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" BaixoScore-Pro.apk --clobber
          else
            gh release create "$TAG" BaixoScore-Pro.apk \
              --title "BaixoScore Pro ${VERSION}" \
              --notes "Instalador Android do BaixoScore Pro ${VERSION}."
          fi

      - name: Keep APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaixoScore-Pro-Android-APK
          path: BaixoScore-Pro.apk
          if-no-files-found: error
          retention-days: 30
