<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101010"><title>Estante de Partituras</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101010}#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#101010}#scrub{position:fixed;left:8%;right:8%;bottom:max(22px,env(safe-area-inset-bottom));height:62px;display:none;align-items:center;gap:12px;padding:10px 14px;border:1px solid rgba(212,175,55,.65);border-radius:16px;background:rgba(18,18,18,.88);box-shadow:0 5px 24px #0008;z-index:10;pointer-events:none;color:#f5d66b;font:600 14px system-ui,sans-serif;backdrop-filter:blur(8px)}#scrub.on{display:flex}#readout{min-width:56px;text-align:center;font-variant-numeric:tabular-nums}#track{position:relative;flex:1;height:6px;border-radius:99px;background:#777}#fill{height:100%;width:0;border-radius:99px;background:#d6b64b}#knob{position:absolute;top:50%;left:0;width:18px;height:18px;border:2px solid #171717;border-radius:50%;background:#f1cf59;transform:translate(-50%,-50%);box-shadow:0 0 0 2px #f1cf5980}
</style></head>
<body>
<iframe id="app" src="https://celsomartins251.github.io/dicas-de-musica/app-estante-de-partituras.html" allow="fullscreen"></iframe>
<div id="scrub" aria-hidden="true"><span id="readout">1 / 1</span><div id="track"><div id="fill"></div><div id="knob"></div></div></div>
<script>
(()=>{'use strict';
const frame=document.getElementById('app'),bar=document.getElementById('scrub'),track=document.getElementById('track'),readout=document.getElementById('readout'),fill=document.getElementById('fill'),knob=document.getElementById('knob');
let doc=null,timer=0,startX=0,startY=0,active=false,target=1,maxPage=1,touchId=null;
function pageInfo(){const el=doc&&doc.getElementById('pageLabel');const m=el&&el.textContent.match(/(\d+)\s*\/\s*(\d+)/);return m?{page:+m[1],max:+m[2]}:{page:1,max:1}}
function paint(x){const r=track.getBoundingClientRect(),ratio=Math.max(0,Math.min(1,(x-r.left)/Math.max(1,r.width)));target=Math.max(1,Math.min(maxPage,Math.round(1+ratio*(maxPage-1))));const p=maxPage<=1?0:(target-1)/(maxPage-1)*100;fill.style.width=p+'%';knob.style.left=p+'%';readout.textContent=target+' / '+maxPage}
function begin(e){if(!doc||e.touches.length!==1||!doc.getElementById('reader')||doc.getElementById('reader').classList.contains('hidden'))return;const t=e.touches[0],stage=doc.getElementById('stage');if(!stage)return;const r=stage.getBoundingClientRect();if(t.clientX<r.left+r.width*.2||t.clientX>r.right-r.width*.2||t.clientY<r.top+r.height*.12||t.clientY>r.bottom-r.height*.12)return;startX=t.clientX;startY=t.clientY;touchId=t.identifier;active=false;const info=pageInfo();maxPage=Math.max(1,info.max);target=info.page;timer=setTimeout(()=>{active=true;bar.classList.add('on');paint(startX)},480)}
function move(e){if(touchId===null)return;const t=[...e.touches].find(x=>x.identifier===touchId);if(!t)return;if(!active){if(Math.hypot(t.clientX-startX,t.clientY-startY)>12){clearTimeout(timer);touchId=null}return}if(e.cancelable)e.preventDefault();e.stopImmediatePropagation();paint(t.clientX)}
async function finish(e,cancel=false){if(touchId===null)return;clearTimeout(timer);const was=active;touchId=null;if(!was)return;if(e&&e.cancelable)e.preventDefault();if(e)e.stopImmediatePropagation();active=false;bar.classList.remove('on');if(cancel)return;const info=pageInfo(),diff=target-info.page,button=doc.getElementById(diff>0?'nextPage':'prevPage');for(let i=0;i<Math.abs(diff);i++){button&&button.click();await new Promise(r=>setTimeout(r,90))}}
function bind(){try{doc=frame.contentDocument;if(!doc)return;const stage=doc.getElementById('stage');if(!stage)return;stage.addEventListener('touchstart',begin,{capture:true,passive:true});stage.addEventListener('touchmove',move,{capture:true,passive:false});stage.addEventListener('touchend',e=>finish(e,false),{capture:true,passive:false});stage.addEventListener('touchcancel',e=>finish(e,true),{capture:true,passive:false})}catch(e){console.error('Não foi possível conectar o navegador de páginas:',e)}}
frame.addEventListener('load',()=>{bind();const poll=setInterval(()=>{if(!doc||!doc.getElementById('stage'))bind();else clearInterval(poll)},700)});
})();
</script></body></html>
